name: Recover verified clean release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-clean-release.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: clean-upstream-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish existing verified installers
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '44446644999'
      SOURCE_COMMIT: f8945b3043c45157228bccb9a392d43da2e35f4a
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify trusted source run and all build gates
        run: |
          python - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('release', Path('.clean/scripts/release.py'))
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'zuijiaosy/cc-switch', 'Unexpected destination repository'
          run_id = os.environ['SOURCE_RUN']
          source = release.api(f'/repos/{repo}/actions/runs/{run_id}')
          assert source['head_sha'] == os.environ['SOURCE_COMMIT'], 'Source commit mismatch'
          assert source['head_repository']['full_name'] == repo, 'Source repository mismatch'
          assert source['head_branch'] == 'main' and source['event'] == 'push', 'Untrusted source event'
          assert source['path'] == '.github/workflows/clean-release.yml', 'Unexpected source workflow'
          assert source['status'] == 'completed' and source['conclusion'] == 'failure', 'Source run is not a completed failed publication'
          jobs = release.api(f'/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100')
          required = {'Check upstream and validate clean source'} | {f'Build {p}' for p in release.PLATFORMS}
          passed = {j['name'] for j in jobs['jobs'] if j['conclusion'] == 'success'}
          assert required <= passed, f'Missing successful build gates: {required - passed}'
          print('Verified source validation and all five native build jobs.')
          PY
      - name: Validate corrected publication logic
        run: python -m unittest discover -s .clean/tests -v
      - uses: actions/download-artifact@v8
        with:
          name: clean-source
          path: .clean-state
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: clean-assets-*
          path: release-assets
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Validate original build provenance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('.clean-state/release.json').read_text())
          assert data['repository'] == os.environ['GITHUB_REPOSITORY']
          assert data['automation_sha'] == os.environ['SOURCE_COMMIT']
          assert data['release_tag'] == 'clean-v4.0.35-r1'
          assert data['upstream_sha'] == '61c43c036ec7eb3a6950b292729d6a7094abe716'
          assert data['signed_updates'] is False, 'This recovery is limited to the verified manual-download build'
          PY
      - name: Verify existing assets and publish completed draft
        run: python .clean/scripts/release.py publish
